<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Driver Query - F1 Database</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='index.css') }}">
    <script type="module" src="{{ request.url_for('static', path='firebase-login.js') }}" defer></script>
  </head>
  <body>
    <div id="query-driver-container" class="container">
      <h2 class="section-title">Query Drivers</h2>
      <form id="query-driver-form" method="POST" action="{{ request.url_for('query_driver_get') }}">
        <div class="form-group">
          <label for="attribute">Attribute:</label>
          <select name="attribute" id="attribute">
            <option value="age">Age</option>
            <option value="pole_positions">Pole Positions</option>
            <option value="race_wins">Race Wins</option>
            <option value="total_points">Total Points</option>
            <option value="world_titles">World Titles</option>
            <option value="fastest_laps">Fastest Laps</option>
          </select>
        </div>
        <div class="form-group">
          <label for="operation">Operation:</label>
          <select name="operation" id="operation">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value=">">></option>
          </select>
        </div>
        <div class="form-group">
          <label for="value">Value:</label>
          <input type="number" name="value_str" id="value">
        </div>
        <div class="form-group">
          <button type="submit">Search</button>
        </div>
      </form>

      {% if drivers %}
        <hr class="divider">
        <h3 class="results-title">Results:</h3>
        <ul id="driver-results">
          {% for d in drivers %}
            <li class="driver-item">
              <a href="{{ request.url_for('driver_details', driver_id=d.id) }}" class="driver-text">{{ d.name }}</a>
              <span class="info">(Age: {{ d.age }})</span>
            </li>
          {% endfor %}
        </ul>
      {% endif %}

      <div class="cancel-button">
        <a href="{{ request.url_for('root') }}">
          <button type="button">Cancel</button>
        </a>
      </div>
    </div>
  </body>
</html>
