<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Add Team - F1 Database</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='index.css') }}">
    <script type="module" src="{{ request.url_for('static', path='firebase-login.js') }}" defer></script>
  </head>
  <body>
    <div id="add-team-container" class="container">
      {% if error %}
        <p id="error-message" style="color:red;">{{ error }}</p>
      {% endif %}
      <h2>Add or Edit Team</h2>
      <form id="team-form" method="POST">
        {% if team %}
          <p id="edit-info">Editing team: {{ team.team_name }} (id: {{ team.id }})</p>
        {% endif %}
        
        <label for="team_name">Team Name:</label>
        <input type="text" id="team_name" name="team_name" value="{{ team.team_name if team else '' }}"><br><br>
        
        <label for="year_founded">Year Founded:</label>
        <input type="number" id="year_founded" name="year_founded" value="{{ team.year_founded if team else '' }}"><br><br>
        
        <label for="pole_positions">Total Pole Positions:</label>
        <input type="number" id="pole_positions" name="pole_positions" value="{{ team.pole_positions if team else '' }}"><br><br>
        
        <label for="race_wins">Total Race Wins:</label>
        <input type="number" id="race_wins" name="race_wins" value="{{ team.race_wins if team else '' }}"><br><br>
        
        <label for="constructor_titles">Total Constructor Titles:</label>
        <input type="number" id="constructor_titles" name="constructor_titles" value="{{ team.constructor_titles if team else '' }}"><br><br>
        
        <label for="finishing_position">Finishing Position (Previous Season):</label>
        <input type="number" id="finishing_position" name="finishing_position" value="{{ team.finishing_position if team else '' }}"><br><br>
        
        <button type="submit">Submit</button>
      </form>
      
      <div id="cancel-container">
        <!-- Updated cancel link: directs back to the home page route -->
        <a href="{{ request.url_for('root') }}">
          <button type="button">Cancel</button>
        </a>
      </div>
    </div>
  </body>
</html>
