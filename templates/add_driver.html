<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Add Driver - F1 Database</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='index.css') }}">
    <script type="module" src="{{ request.url_for('static', path='firebase-login.js') }}" defer></script>
  </head>
  <body>
    <div id="add-driver-container" class="container">
      {% if error %}
        <p id="error-message" style="color:red;">{{ error }}</p>
      {% endif %}
      <h2>Add or Edit Driver</h2>
      <form id="driver-form" method="POST">
        {% if driver %}
          <p id="edit-info">Editing driver: {{ driver.name }} (id: {{ driver.id }})</p>
        {% endif %}
        
        <label for="driver_name">Driver Name:</label>
        <input type="text" id="driver_name" name="driver_name" value="{{ driver.name if driver else '' }}"><br><br>
        
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" value="{{ driver.age if driver else '' }}"><br><br>
        
        <label for="pole_positions">Total Pole Positions:</label>
        <input type="number" id="pole_positions" name="pole_positions" value="{{ driver.pole_positions if driver else '' }}"><br><br>
        
        <label for="race_wins">Total Race Wins:</label>
        <input type="number" id="race_wins" name="race_wins" value="{{ driver.race_wins if driver else '' }}"><br><br>
        
        <label for="total_points">Total Points Scored:</label>
        <input type="number" id="total_points" name="total_points" value="{{ driver.total_points if driver else '' }}"><br><br>
        
        <label for="world_titles">Total World Titles:</label>
        <input type="number" id="world_titles" name="world_titles" value="{{ driver.world_titles if driver else '' }}"><br><br>
        
        <label for="fastest_laps">Total Fastest Laps:</label>
        <input type="number" id="fastest_laps" name="fastest_laps" value="{{ driver.fastest_laps if driver else '' }}"><br><br>
        
        <label for="team_name">Team Name:</label>
        <input type="text" id="team_name" name="team_name" value="{{ driver.team if driver else '' }}"><br><br>
        
        <button type="submit">Submit</button>
      </form>
      
      <div id="cancel-container">
        <!-- Update the cancel link to use the root route -->
        <a href="{{ request.url_for('root') }}">
          <button type="button">Cancel</button>
        </a>
      </div>
    </div>
  </body>
</html>
