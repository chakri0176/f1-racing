<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Query Teams - F1 Database</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='index.css') }}">
    <script type="module" src="{{ request.url_for('static', path='firebase-login.js') }}" defer></script>
  </head>
  <body>
    <div id="query-team-container" class="container">
      <h2 class="section-title">Query Teams</h2>
      <form id="query-team-form" method="POST" action="{{ request.url_for('query_team_get') }}">
        <div class="form-group">
          <label for="attribute">Attribute:</label>
          <select name="attribute" id="attribute">
            <option value="year_founded">Year Founded</option>
            <option value="pole_positions">Pole Positions</option>
            <option value="race_wins">Race Wins</option>
            <option value="constructor_titles">Constructor Titles</option>
            <option value="finishing_position">Finishing Position</option>
          </select>
        </div>
        <div class="form-group">
          <label for="operation">Operation:</label>
          <select name="operation" id="operation">
            <option value="=">=</option>
            <option value="<"><</option>
            <option value=">">></option>
          </select>
        </div>
        <div class="form-group">
          <label for="value">Value:</label>
          <input type="number" name="value_str" id="value">
        </div>
        <div class="form-group">
          <button type="submit">Search</button>
        </div>
      </form>

      {% if teams %}
        <hr class="divider">
        <h3 class="results-title">Results:</h3>
        <ul id="team-results">
          {% for t in teams %}
            <li class="team-item">
              <a href="{{ request.url_for('team_details', team_id=t.id) }}" class="team-text">{{ t.team_name }}</a>
              <span class="info">(Founded: {{ t.year_founded }})</span>
            </li>
          {% endfor %}
        </ul>
      {% endif %}

      <div class="cancel-button">
        <a href="{{ request.url_for('root') }}">
          <button type="button">Cancel</button>
        </a>
      </div>
    </div>
  </body>
</html>
